syntax = "proto3";

package api.regulatoryreporting.v1;

option go_package = "github.com/wyfcoding/financialtrading/go-api/regulatoryreporting/v1;regulatoryreportingv1";

service Service {
  rpc Health(HealthRequest) returns (HealthResponse);
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
}
