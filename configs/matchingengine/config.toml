version = "1.0.0"

[server]
name = "matchingengine"
environment = "prod"

  [server.grpc]
  addr = "0.0.0.0"
  port = 9097
  timeout = "1s"

[data.redis]
addrs = ["127.0.0.1:6379"]
password = ""
db = 3

[messagequeue.kafka]
brokers = ["127.0.0.1:9092"]
topic = "market.trades"         
group_id = "matching-engine-01"
async = true
max_bytes = 1048576             

[log]
level = "info"
format = "json"

[tracing]
enabled = false                 
service_name = "matchingengine"
otlp_endpoint = "localhost:4317"
sampler_ratio = 0.0
